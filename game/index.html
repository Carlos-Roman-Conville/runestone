<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Runestone</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1816;
        font-family: system-ui, sans-serif;
        color: #e8e0d4;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #test-ad {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        font-size: 11px;
        padding: 4px 8px;
        opacity: 0.7;
      }
      #ad-result {
        position: fixed;
        right: 8px;
        bottom: 36px;
        font-size: 10px;
        font-family: ui-monospace, monospace;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="test-ad" type="button">Test ad</button>
    <div id="ad-result" aria-live="polite"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
