<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1816" />
    <title>Runestone</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1816;
        /* Feel: the finger belongs to the game. No scroll, no pull-to-refresh, no text selection, no tap flash. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e8e0d4;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      #test-ad {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        font-size: 11px;
        padding: 4px 8px;
        opacity: 0.7;
      }
      #ad-result {
        position: fixed;
        right: 8px;
        bottom: 36px;
        font-size: 10px;
        font-family: ui-monospace, monospace;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="test-ad" type="button">Test ad</button>
    <div id="ad-result" aria-live="polite"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
