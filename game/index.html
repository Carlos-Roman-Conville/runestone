<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Runestone</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1816;
        font-family: system-ui, sans-serif;
        color: #e8e0d4;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #test-ad {
        margin-top: 1rem;
        font-size: 1rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
      }
      #ad-result {
        margin-top: 0.5rem;
        min-height: 1.25rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="test-ad" type="button">Show test ad</button>
    <div id="ad-result" aria-live="polite"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
