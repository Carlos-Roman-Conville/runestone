name: engine
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest   # no PixiJS render, no Capacitor, no Android SDK: proves engine/ has no renderer dependency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run check:layers
      - run: npm run typecheck
      - run: npm run test
